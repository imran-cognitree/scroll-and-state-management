name: Frontend CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    name: Lint, Test, & E2E
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: 'frontend/pnpm-lock.yaml'

      - name: Install Dependencies
        run: pnpm install

      - name: Install Playwright Browsers
        run: pnpm exec playwright install --with-deps

      - name: Run Linter (oxlint)
        run: pnpm run lint

      - name: Run Unit & Integration Tests (Vitest)
        # We use pnpm exec vitest run so it executes once and doesn't hang in watch mode
        run: pnpm exec vitest run

      - name: Run E2E Smoke Tests (Playwright)
        # This will automatically run `pnpm run build` and `pnpm run preview` 
        # before running the tests, as configured in playwright.config.ts
        run: pnpm test:e2e

      - name: Upload Playwright Report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }} # Always run this step even if tests fail
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 15
